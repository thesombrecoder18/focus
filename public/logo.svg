<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B52EF"/>
      <stop offset="100%" stop-color="#3730C8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Lettermark "E" + focus circle -->
  <!-- Spine (vertical left bar) -->
  <rect x="124" y="136" width="52" height="240" rx="8" fill="white"/>

  <!-- Top bar (full width) -->
  <rect x="124" y="136" width="248" height="52" rx="8" fill="white"/>

  <!-- Bottom bar (full width) -->
  <rect x="124" y="324" width="248" height="52" rx="8" fill="white"/>

  <!-- Middle bar (shorter, ending before the focus ring) -->
  <rect x="124" y="230" width="160" height="52" rx="8" fill="white"/>

  <!-- Focus ring — circle centered vertically on middle bar, to the right -->
  <!-- Outer ring -->
  <circle cx="340" cy="256" r="42" stroke="white" stroke-width="18" fill="none"/>

  <!-- Inner dot (focal point) -->
  <circle cx="340" cy="256" r="10" fill="white"/>
</svg>
